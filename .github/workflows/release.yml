name: Release

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            platform: darwin
            architecture: x64
          - runner: macos-15
            platform: darwin
            architecture: arm64
          - runner: windows-2022
            platform: win32
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PI_ARK_TARGET_PLATFORM: ${{ matrix.platform }}
      PI_ARK_TARGET_ARCH: ${{ matrix.architecture }}
      npm_config_build_from_source: "true"
      TMPDIR: ${{ github.workspace }}/.tmp
      TMP: ${{ github.workspace }}/.tmp
      TEMP: ${{ github.workspace }}/.tmp
      RUNNER_TEMP: ${{ github.workspace }}/.tmp/native-runner
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-local temporary storage
        run: |
          node -e "require('node:fs').mkdirSync(process.env.RUNNER_TEMP, { recursive: true })"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Verify native runner platform and architecture
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { arch, machine, platform } from 'node:os';
          assert.equal(platform(), process.env.PI_ARK_TARGET_PLATFORM);
          assert.equal(arch(), process.env.PI_ARK_TARGET_ARCH);
          assert.equal(({ x86_64: 'x64', AMD64: 'x64', arm64: 'arm64', aarch64: 'arm64' })[machine()], arch());
          console.log(`Native build host: ${platform()}/${machine()}, Node ${process.version} (${arch()})`);
          NODE
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Install Windows native node-pty build prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre'
          "npm_config_python=$((Get-Command python.exe).Source)" >> $env:GITHUB_ENV
          'npm_config_msvs_version=2022' >> $env:GITHUB_ENV
          $ready = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires $component -property installationPath
          if (-not $ready) {
            $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installation) { throw 'Visual Studio C++ build tools are required for node-pty' }
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $arguments = @('modify', '--installPath', "`"$installation`"", '--add', $component, '--quiet', '--norestart', '--nocache')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio prerequisite installation failed: $($process.ExitCode)" }
          }
      - run: node scripts/check-ci-command.mjs npm ci
      - run: node scripts/check-ci-command.mjs npm run check
      - run: node scripts/check-ci-command.mjs npm run check:behavior
      - run: node scripts/check-ci-command.mjs npm run build
      - name: Build native release archive
        id: release_build
        run: node scripts/check-ci-command.mjs npm run release:build
        env:
          PI_ARK_SKIP_BUILD: "1"
      - name: Extract and smoke the actual release archive
        id: release_smoke
        env:
          PI_ARK_SMOKE_ROLLBACK: "1"
        run: |
          node scripts/check-ci-command.mjs node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdtemp, readFile, rm } from 'node:fs/promises';
          import { join } from 'node:path';
          import { extractArchive } from './scripts/platform.mjs';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const name = `pi-ark-${version}-${process.platform}-${process.arch}`;
          const windows = process.platform === 'win32';
          const archive = join(process.cwd(), 'dist/release', `${name}.${windows ? 'zip' : 'tar.gz'}`);
          const extracted = await mkdtemp(join(process.env.RUNNER_TEMP, 'pi-ark-release-extracted-'));
          try {
            extractArchive(archive, extracted);
            execFileSync(process.execPath, ['scripts/check-release.mjs', join(extracted, name)], { stdio: 'inherit', timeout: 600000 });
          } finally {
            await rm(extracted, { recursive: true, force: true });
          }
          NODE
      - name: Upload release archive
        if: success() && steps.release_build.outcome == 'success' && steps.release_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pi-ark-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error
      - name: Preserve native build and smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/native-ci/*.log
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Verify release tag and successful candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs --commit "$(git rev-parse HEAD)" --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY"
      - name: Download the verified candidate archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          artifact-ids: ${{ steps.candidate.outputs.artifact-ids }}
          path: artifacts
          merge-multiple: true
      - name: Verify the exact archive filename list
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdir } from 'node:fs/promises';
          import { RELEASE_ARTIFACT_NAMES } from './scripts/release-candidate.mjs';
          const expected = RELEASE_ARTIFACT_NAMES.map((name) => `${name.replace('pi-ark-', `pi-ark-${process.env.RELEASE_VERSION}-`)}.${name.includes('win32') ? 'zip' : 'tar.gz'}`).sort();
          const entries = await readdir('artifacts', { withFileTypes: true });
          assert.ok(entries.every((entry) => entry.isFile()), 'Candidate artifacts must contain archive files');
          assert.deepEqual(entries.map((entry) => entry.name).sort(), expected, 'Candidate archive filename list must match the release version and all native platforms');
          console.log(`Verified release archives:\n${expected.join('\n')}`);
          NODE
      - name: Write release notes
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Pi-Ark ${{ steps.candidate.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          fail_on_unmatched_files: true
